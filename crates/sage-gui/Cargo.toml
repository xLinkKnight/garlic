[package]
name = "sage-gui"
version = "0.23.0"
edition = "2021"
description = "Desktop front-end for editing Sage search settings and running searches"
license = "MIT"

[[bin]]
name = "sage-gui"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
rfd = "0.15"
roxmltree = "0.20"
serde_json = "1.0"
ureq = "2.12"
egui_plot = "0.31"
# Spectrum viewer: spectra are read exactly as Sage read them...
sage-core = { path = "../sage" }
sage-cloudpath = { path = "../sage-cloudpath" }
# ...and annotated by Annotator's engine (github.com/snijderlab/annotator):
# ProForma 2.0 incl. crosslinks (mzcore), fragmentation and matching (mzannotate)
mzcore = "0.2"
mzannotate = "0.2"
mzdata = { version = "0.65", default-features = false, features = ["miniz_oxide"] }
# Figure export: SVG rendered to PNG / TIFF
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# PDF export of figures (shares usvg 0.45 with resvg)
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# (examples/make_icon.rs, which draws the application icon, uses `image` too)

[target.'cfg(windows)'.build-dependencies]
# build.rs embeds assets/garlic.ico as the .exe icon
winresource = "0.1"

[dev-dependencies]
# headless rendering of the window for screenshots (tests only)
egui_kittest = { version = "0.31.1", features = ["wgpu"] }
