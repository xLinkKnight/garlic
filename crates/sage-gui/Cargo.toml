[package]
name = "sage-gui"
version = "0.16.0"
edition = "2021"
description = "Desktop front-end for editing Sage search settings and running searches"
license = "MIT"

[[bin]]
name = "sage-gui"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
rfd = "0.15"
roxmltree = "0.20"
serde_json = "1.0"
ureq = "2.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# examples/make_icon.rs draws the application icon
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
# build.rs embeds assets/garlic.ico as the .exe icon
winresource = "0.1"
